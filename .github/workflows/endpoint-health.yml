# Weekly live check of every suggestion endpoint, so broken engines are noticed early.
name: Endpoint health

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check endpoints
        run: |
          node scripts/check-endpoints.js | tee report.txt
          { echo '## Endpoint health'; echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
